# Only needed if you deploy the counter Worker from the command line (npx wrangler deploy).
# Deploying from the dashboard (paste hit-worker.js, add the D1 binding) needs no wrangler.toml.
name = "yokozuna-hit"
main = "hit-worker.js"
compatibility_date = "2026-11-01"

[[d1_databases]]
binding = "DB"
database_name = "yokozuna-analytics"
database_id = "68feff66-e5fd-4699-a5d1-6162e0d46689"

# secrets (not in this file):  npx wrangler secret put VISITOR_SALT   /   npx wrangler secret put STATS_KEY
