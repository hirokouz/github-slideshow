<title>横綱への道</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yuji+Boku&family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
/* Layout: a single column of washi "banzuke" sheets laid on an indigo arena night; the side-view dohyo canvas is the stage. Single dark world by design. */
:root{
  --ai:#0f1630;        /* indigo night */
  --ai2:#18214a;       /* raised indigo */
  --washi:#efe6d0;     /* banzuke paper */
  --sumi:#1a1612;      /* ink */
  --shu:#b3261e;       /* vermilion seal */
  --kin:#e2b04a;       /* gold */
  --shiro:#f3eee2;     /* text on dark */
  --nezumi:#9aa2bd;    /* muted */
  --tsuchi:#c7965a;    /* clay */
  --line:rgba(226,176,74,.28);
  --f-brush:"Yuji Boku","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-mincho:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{min-height:100%;margin:0;color:var(--shiro);font-family:var(--f-body);-webkit-tap-highlight-color:transparent}
body{background-color:var(--ai);
  background-image:
    radial-gradient(circle at 50% 100%,transparent 18px,rgba(255,255,255,.035) 19px,rgba(255,255,255,.035) 21px,transparent 22px),
    radial-gradient(circle at 0 50%,transparent 18px,rgba(255,255,255,.035) 19px,rgba(255,255,255,.035) 21px,transparent 22px),
    radial-gradient(ellipse at 50% -10%,rgba(226,176,74,.16),transparent 60%);
  background-size:40px 20px,40px 20px,100% 100%;background-attachment:scroll,scroll,fixed}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-user-select:none;user-select:none}
button:focus-visible,input:focus-visible,label:focus-within{outline:2px solid var(--kin);outline-offset:3px}
.wrap{max-width:440px;margin:0 auto;display:grid;gap:16px;
  padding-block:calc(env(safe-area-inset-top,0px) + 14px) calc(env(safe-area-inset-bottom,0px) + 28px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.scr{display:grid;gap:16px}
h1,h2,h3{margin:0;font-weight:400;text-wrap:balance}
p{margin:0;line-height:1.75}
.label{margin:0;font-size:11px;letter-spacing:.18em;color:var(--kin)}
.muted{color:var(--nezumi)}
.brush{font-family:var(--f-brush)}

.washi{position:relative;background:var(--washi);color:var(--sumi);border-radius:4px;padding:16px;
  background-image:repeating-linear-gradient(90deg,rgba(0,0,0,.025) 0 1px,transparent 1px 7px),radial-gradient(ellipse at 30% 20%,rgba(255,255,255,.5),transparent 60%);
  box-shadow:0 1px 0 rgba(255,255,255,.4) inset,0 12px 30px rgba(0,0,0,.35)}
.washi::before{content:"";position:absolute;inset:6px;border:1.5px solid rgba(26,22,18,.6);border-radius:2px;pointer-events:none}
.washi .label{color:var(--shu)}
.seal{display:inline-grid;place-items:center;width:30px;height:30px;border:2px solid var(--shu);color:var(--shu);border-radius:4px;font-family:var(--f-brush);font-size:16px;transform:rotate(-4deg)}

.panel{background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.015));border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:10px}
.primary{width:100%;border:0;border-radius:12px;padding:15px 18px;font-weight:700;font-size:17px;color:#2a1700;
  background:linear-gradient(180deg,#f0c766,#d49a2e);box-shadow:0 4px 0 #7d5512,0 10px 24px rgba(226,176,74,.25)}
.primary:active{transform:translateY(2px);box-shadow:0 2px 0 #7d5512}
.ghost{width:100%;background:transparent;border:1px solid var(--line);border-radius:12px;padding:12px 16px;font-weight:700;font-size:15px}
.ink{color:var(--sumi);border-color:rgba(26,22,18,.5)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}

/* title */
.hero{display:grid;gap:14px;justify-items:center;text-align:center;padding-top:6px}
.logo{font-family:var(--f-brush);font-size:clamp(60px,19vw,92px);line-height:1;color:var(--shiro);text-shadow:0 0 34px rgba(226,176,74,.35)}
.logo .sub{display:block;font-family:var(--f-mincho);font-weight:800;font-size:12px;letter-spacing:.5em;color:var(--kin);margin-bottom:12px;text-shadow:none}
#heroCv{width:100%;max-width:400px;aspect-ratio:400/300;display:block;border-radius:10px}

/* create */
input[type=text]{width:100%;box-sizing:border-box;background:#fffaf0;color:var(--sumi);border:1.5px solid var(--sumi);border-radius:6px;padding:10px 14px;font-size:26px;font-family:var(--f-brush)}
.faceed{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:12px;align-items:center}
#facePrev{width:100%;aspect-ratio:1;display:block;border-radius:6px;background:radial-gradient(circle at 50% 40%,#fff6e0,#e3d4b2)}
.fopts{display:grid;gap:5px}
.fopt{display:grid;grid-template-columns:3.2em 28px 1fr 28px;align-items:center;gap:4px;font-size:12.5px}
.fopt .n{font-family:var(--f-mincho);font-weight:800;color:var(--shu);font-size:12px}
.fopt button{width:28px;height:28px;border-radius:50%;border:1.5px solid rgba(26,22,18,.45);background:#fffaf0;color:var(--sumi);font-size:14px;line-height:1;padding:0}
.fopt button:active{background:var(--kin)}
.fopt .v{text-align:center;font-weight:700;color:var(--sumi);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:370px){.faceed{grid-template-columns:1fr}#facePrev{max-width:220px;margin:0 auto}}
.types{display:grid;gap:8px}
.types label{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;align-items:center;background:var(--ai2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer}
.types input{position:absolute;opacity:0;pointer-events:none}
.types .k{grid-row:1 / span 2;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-brush);font-size:22px;border:1.5px solid var(--line)}
.types b{font-size:15px}.types span.d{font-size:12px;color:var(--nezumi)}
.types label:has(input:checked){border-color:var(--kin);background:#24305e}
.types label:has(input:checked) .k{background:var(--kin);color:#2a1700;border-color:var(--kin)}

/* home header */
.head{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:stretch}
#avatar{width:132px;height:160px;display:block}
.plate{writing-mode:vertical-rl;font-family:var(--f-brush);font-size:32px;line-height:1.05;letter-spacing:.04em;padding:6px 0 6px 6px;border-left:1.5px solid rgba(26,22,18,.5);display:flex;align-items:center}
.plate small{font-size:15px;color:var(--shu);margin-block-start:8px}
.rinfo{display:grid;gap:4px;align-content:center;min-width:0}
.rinfo .side{font-family:var(--f-mincho);font-weight:800;color:var(--shu);font-size:13px;letter-spacing:.2em}
.rinfo .rank{font-family:var(--f-brush);font-size:27px;line-height:1.15}
.rinfo .when{font-size:12px;color:#5b5246}
.turns{display:flex;gap:4px;align-items:center;font-size:12px;color:#5b5246;margin-top:4px;flex-wrap:wrap}
.turns i{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--sumi)}
.turns i.used{background:var(--sumi)}

.stats{display:grid;gap:9px}
.stat{display:grid;grid-template-columns:3.6em 1fr 3.4em;gap:10px;align-items:center;font-size:13px}
.stat .n{font-family:var(--f-mincho);font-weight:800}
.bar{height:10px;background:rgba(0,0,0,.35);border-radius:5px;overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.5)}
.bar i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,#9b6a35,var(--tsuchi),#e3b57a);transition:width .5s ease}
.bar.fat i{background:linear-gradient(90deg,#7c1d18,#d2463f)}
.bar.kg i{background:linear-gradient(90deg,#6c5a8a,#a58bd0)}
.stat b{text-align:right;font-variant-numeric:tabular-nums;font-size:14px}
.gain{color:var(--kin);font-size:11px;margin-left:2px}

.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.acts button{display:grid;grid-template-columns:auto 1fr;gap:1px 10px;align-items:center;text-align:left;background:var(--ai2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;transition:transform .08s}
.acts button:active{transform:scale(.97);background:#24305e}
.acts .k{grid-row:1 / span 2;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--washi);color:var(--sumi);font-family:var(--f-brush);font-size:20px}
.acts b{font-size:15px}.acts span.d{font-size:11px;color:var(--nezumi);line-height:1.45}
.acts button:disabled{opacity:.35;cursor:default}
.log{display:grid;gap:7px;font-size:13px}
.log p{padding-left:10px;border-left:2px solid var(--line);color:var(--nezumi)}
.log p:first-child{border-left-color:var(--kin);color:var(--shiro)}
.hist{width:100%;border-collapse:collapse;font-size:12.5px}
.hist td{padding:6px 4px;border-bottom:1px solid rgba(26,22,18,.15);white-space:nowrap}
.hist td:nth-child(2){font-family:var(--f-mincho);font-weight:800}
.hist td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.histbox{overflow-x:auto}
.yusho{color:var(--shu);font-weight:700}

/* bout */
.bouthead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.day{font-family:var(--f-brush);font-size:30px}
.hoshi{font-family:var(--f-mincho);font-weight:800;font-size:16px;letter-spacing:.12em;word-break:break-all}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center;text-align:center}
.vs .card{background:var(--washi);color:var(--sumi);border-radius:4px;padding:8px 6px;display:grid;gap:2px;min-width:0}
.vs .nm{font-family:var(--f-brush);font-size:24px;line-height:1.15}
.vs .rk{font-family:var(--f-mincho);font-weight:800;font-size:11px;color:var(--shu)}
.vs .st{font-size:11.5px;color:#5b5246}
.vs .x{font-family:var(--f-brush);font-size:22px;color:var(--kin)}
.prof{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center;padding:12px 14px}
#bFace{width:64px;height:64px;display:block;border-radius:50%;background:radial-gradient(circle at 50% 40%,#fff6e0,#d9c7a2);box-shadow:inset 0 0 0 1.5px rgba(26,22,18,.5)}
.prof .top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.prof .pn{font-family:var(--f-brush);font-size:24px;line-height:1.1}
.prof .pr{font-family:var(--f-mincho);font-weight:800;font-size:12px;color:var(--shu)}
.prof dl{margin:4px 0 0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px 10px;font-size:11.5px}
.prof dl div{min-width:0}
.prof dt{color:#7a6e5e;font-size:10px;letter-spacing:.08em}
.prof dd{margin:0;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ring{width:100%;aspect-ratio:400/330;display:block;border-radius:10px;touch-action:manipulation;box-shadow:0 14px 34px rgba(0,0,0,.45)}
.strats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.strats button{display:grid;gap:2px;justify-items:center;background:var(--ai2);border:1px solid var(--line);border-radius:12px;padding:10px 6px}
.strats button:active{background:#24305e}
.strats .k{font-family:var(--f-brush);font-size:30px;line-height:1.1;color:var(--kin)}
.strats b{font-size:13px}
.strats span{font-size:10.5px;color:var(--nezumi)}
.hint{font-size:12px;color:var(--nezumi);text-align:center}
.auto{display:flex;gap:8px;align-items:center;justify-content:center;font-size:13px;color:var(--nezumi)}
.auto input{accent-color:var(--kin);width:18px;height:18px}

/* result */
.result-big{font-family:var(--f-brush);font-size:clamp(48px,15vw,70px);text-align:center;line-height:1.1}
.result-big.gold{color:var(--kin);text-shadow:0 0 30px rgba(226,176,74,.5)}
.result-big.down{color:var(--nezumi)}
.change{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;justify-items:center}
.vplate{writing-mode:vertical-rl;font-family:var(--f-brush);font-size:24px;line-height:1.1;min-height:7.5em;padding:4px 0}
.vplate small{font-family:var(--f-mincho);font-weight:800;font-size:13px;color:var(--shu);margin-block-end:6px}
.vplate.old{opacity:.5}
.change .arrow{font-family:var(--f-brush);font-size:28px;color:var(--shu)}
#rCv{width:100%;max-width:300px;aspect-ratio:1;margin:0 auto;display:block}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">

  <!-- TITLE -->
  <section id="sTitle" class="scr">
    <div class="hero">
      <h1 class="logo"><span class="sub">SUMO CAREER RPG</span>横綱への道</h1>
      <canvas id="heroCv" aria-label="土俵の上の力士"></canvas>
      <p>序ノ口の新弟子から、稽古と本場所で番付を上げていく。<br>めざすは綱を締めるその日。</p>
    </div>
    <div class="washi" id="tCareer" hidden></div>
    <button class="primary" id="contBtn" hidden>つづきから</button>
    <button class="primary" id="newBtn">新弟子として入門する</button>
    <p class="muted" style="font-size:12.5px;text-align:center">稽古は1場所ごとに5回。幕下以下は7番、十両から上は15番。勝ち越せば番付が上がる。</p>
  </section>

  <!-- CREATE -->
  <section id="sCreate" class="scr" hidden>
    <div class="washi" style="display:grid;gap:12px">
      <p class="label">入門届</p>
      <h2 class="brush" style="font-size:30px">しこ名を決める</h2>
      <div class="row"><input type="text" id="nameIn" maxlength="6" aria-label="しこ名" class="grow"><button class="ghost ink" id="randName" style="width:auto">おまかせ</button></div>
    </div>
    <div class="washi" style="display:grid;gap:12px">
      <div class="row" style="justify-content:space-between"><p class="label">顔をつくる</p><button class="ghost ink" id="faceRand" style="width:auto;padding:6px 12px;font-size:13px">おまかせ</button></div>
      <div class="faceed">
        <canvas id="facePrev" aria-label="顔のプレビュー"></canvas>
        <div class="fopts" id="faceOpts"></div>
      </div>
    </div>
    <p class="label">体つき</p>
    <div class="types">
      <label><input type="radio" name="type" value="oshi" id="tOshi" checked><span class="k">押</span><b>押し相撲型</b><span class="d">押しが強い。前に出て一気に勝負</span></label>
      <label><input type="radio" name="type" value="yotsu" id="tYotsu"><span class="k">四</span><b>四つ相撲型</b><span class="d">力が強く体も大きい。まわしを取って寄る</span></label>
      <label><input type="radio" name="type" value="waza" id="tWaza"><span class="k">技</span><b>技能派</b><span class="d">小柄で素早い。技とスピードでかわす</span></label>
    </div>
    <button class="primary" id="enterBtn">入門する</button>
  </section>

  <!-- HOME -->
  <section id="sHome" class="scr" hidden>
    <div class="washi">
      <div class="head">
        <canvas id="avatar" aria-label="あなたの力士"></canvas>
        <div class="rinfo">
          <span class="side" id="hSide">東</span>
          <span class="rank" id="hRank">序ノ口</span>
          <span class="when" id="hWhen"></span>
          <div class="turns" id="hTurns"></div>
        </div>
        <div class="plate" id="hTate"></div>
      </div>
    </div>
    <div class="panel">
      <div class="row" style="justify-content:space-between"><p class="label">体と技</p><span class="muted" style="font-size:11px" id="hPower"></span></div>
      <div class="stats" id="hStats"></div>
    </div>
    <div>
      <p class="label" style="margin-bottom:8px">今日の稽古</p>
      <div class="acts" id="hActs"></div>
    </div>
    <button class="primary" id="bashoBtn" hidden>本場所へ</button>
    <div class="panel">
      <p class="label">親方と部屋のようす</p>
      <div class="log" id="hLog"></div>
    </div>
    <div class="washi">
      <p class="label" style="margin-bottom:6px">星取表</p>
      <div class="histbox"><table class="hist" id="hHist"></table></div>
    </div>
    <button class="ghost" id="toTitle">タイトルへ（自動で保存されます）</button>
  </section>

  <!-- BOUT -->
  <section id="sBout" class="scr" hidden>
    <div class="washi prof" aria-label="力士プロフィール">
      <canvas id="bFace" aria-hidden="true"></canvas>
      <div style="min-width:0">
        <div class="top"><span class="pn" id="pName"></span><span class="pr" id="pRank"></span></div>
        <dl>
          <div><dt>年齢</dt><dd id="pAge"></dd></div>
          <div><dt>入門</dt><dd id="pYear"></dd></div>
          <div><dt>出身</dt><dd id="pHome"></dd></div>
          <div><dt>身長・体重</dt><dd id="pBody"></dd></div>
          <div><dt>通算成績</dt><dd id="pCareer"></dd></div>
          <div><dt>優勝</dt><dd id="pYusho"></dd></div>
        </dl>
      </div>
    </div>
    <div class="bouthead"><span class="day" id="bDay">初日</span><span class="hoshi" id="bHoshi"></span></div>
    <div class="vs">
      <div class="card"><span class="rk" id="bMyRank"></span><span class="nm" id="bMy"></span><span class="st" id="bMySt"></span></div>
      <span class="x">対</span>
      <div class="card"><span class="rk" id="bOpRank"></span><span class="nm" id="bOp"></span><span class="st" id="bOpSt"></span></div>
    </div>
    <canvas id="ring" aria-label="土俵"></canvas>
    <div id="bPick">
      <p class="hint" style="margin-bottom:8px">押しは四つに、四つは技に、技は押しに強い</p>
      <div class="strats">
        <button data-s="oshi"><span class="k">押</span><b>押し</b><span>押し・体重</span></button>
        <button data-s="yotsu"><span class="k">四</span><b>四つ</b><span>力・体重</span></button>
        <button data-s="waza"><span class="k">技</span><b>技</b><span>技・速さ</span></button>
      </div>
    </div>
    <div id="bTachi" hidden>
      <button class="primary" id="tachiBtn">立つ！</button>
      <p class="hint" style="margin-top:8px">白い輪が金の輪に重なった瞬間に立つ。早すぎると「待った」</p>
    </div>
    <div id="bNext" hidden><button class="primary" id="nextBtn">次の一番へ</button></div>
    <label class="auto"><input type="checkbox" id="autoChk">残りの取組をおまかせで取る</label>
  </section>

  <!-- BASHO RESULT -->
  <section id="sResult" class="scr" hidden>
    <p class="label" id="rBasho" style="text-align:center">初場所</p>
    <div class="result-big" id="rBig">勝ち越し</div>
    <canvas id="rCv" aria-label="場所を終えた力士"></canvas>
    <div class="hoshi" id="rHoshi" style="text-align:center"></div>
    <p id="rMsg" style="text-align:center"></p>
    <div class="washi">
      <div class="row" style="justify-content:space-between;margin-bottom:6px"><p class="label">番付発表</p><span class="seal">新</span></div>
      <div class="change">
        <div class="vplate old" id="rOld"></div>
        <span class="arrow">→</span>
        <div class="vplate" id="rNew"></div>
      </div>
    </div>
    <button class="primary" id="backHome">部屋に帰る</button>
  </section>
</div>

<script>
(()=>{
"use strict";
const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.random()*(b-a), pick=a=>a[Math.floor(Math.random()*a.length)];
const lerp=(a,b,t)=>a+(b-a)*t, clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const ease=t=>1-Math.pow(1-clamp(t,0,1),3), easeIn=t=>Math.pow(clamp(t,0,1),2), easeIO=t=>{t=clamp(t,0,1);return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;};
const REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches;
const KAN=['一','二','三','四','五','六','七','八','九','十','十一','十二','十三','十四','十五','十六','十七','十八','十九','二十'];
const kanNum=n=>n<=20?KAN[n-1]:(Math.floor(n/10)>1?KAN[Math.floor(n/10)-1]:'')+'十'+(n%10?KAN[n%10-1]:'');

/* ---------- banzuke ---------- */
const DIVS=[{n:'序ノ口',c:20,b:7,step:3},{n:'序二段',c:40,b:7,step:5},{n:'三段目',c:40,b:7,step:5},{n:'幕下',c:30,b:7,step:3.5},{n:'十両',c:14,b:15,step:1.3},{n:'前頭',c:17,b:15,step:1.3}];
const SAN=['小結','関脇','大関','横綱'];const KOMU=161,SEKI=162,OZEKI=163,YOKO=164,JURYO=130,MAKU=144;
function rank(pos){
  if(pos>=KOMU)return{div:SAN[pos-KOMU],name:SAN[pos-KOMU],bouts:15};
  let s=0;for(const d of DIVS){if(pos<s+d.c){const num=d.c-(pos-s);return{div:d.n,name:d.n+(d.n==='前頭'&&num===1?'筆頭':kanNum(num)+'枚目'),bouts:d.b,step:d.step};}s+=d.c;}
}
const side=pos=>pos%2?'西':'東';

/* ---------- face ---------- */
const FACE_OPTS={
  shape:{n:'輪郭',v:['まる','たまご','えら張り','しもぶくれ']},
  brow: {n:'眉',  v:['太い','細い','八の字','つり']},
  eye:  {n:'目',  v:['細目','どんぐり','きりっと','たれ目']},

};
const SKIN=['#f2d3b6','#e3b892','#cd9c74','#b07b55'];
const randFace=()=>{const f={};for(const k in FACE_OPTS)f[k]=Math.floor(Math.random()*FACE_OPTS[k].v.length);return f;};
const defaultFace=()=>({shape:0,brow:0,eye:0,nose:0,mouth:0,extra:0,skin:1});

/* ---------- save ---------- */
const KEY='sumo-rpg-v1';let st=null;
function persist(){try{localStorage.setItem(KEY,JSON.stringify(st));}catch(e){}}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&!s.face){s.face=defaultFace();if(typeof s.skin==='number')s.face.skin=clamp(s.skin,0,3);}
  if(s&&s.age0===undefined)Object.assign(s,profileSeed(s.type));return s;}catch(e){return null;}}
const PREFS=['北海道','青森','秋田','岩手','山形','宮城','福島','茨城','栃木','群馬','埼玉','千葉','東京','神奈川','新潟','富山','石川','福井','山梨','長野','岐阜','静岡','愛知','三重','滋賀','京都','大阪','兵庫','奈良','和歌山','鳥取','島根','岡山','広島','山口','徳島','香川','愛媛','高知','福岡','佐賀','長崎','熊本','大分','宮崎','鹿児島','沖縄'];
function profileSeed(type){return{age0:15+Math.floor(Math.random()*8),height:Math.round(({oshi:180,yotsu:184,waza:175}[type]||180)+rnd(-4,5)),home:pick(PREFS)};}
const ageOf=s=>s.age0+Math.floor(s.b/6);
const yearOf=s=>Math.floor(s.b/6)+1;

/* ---------- drawing helpers ---------- */
function shade(col,amt){let r,g2,b2;if(col[0]==='#'){const n=parseInt(col.slice(1),16);r=n>>16;g2=n>>8&255;b2=n&255;}else{[r,g2,b2]=col.match(/\d+/g).map(Number);}const f=v=>clamp(Math.round(v*(1+amt)),0,255);return'rgb('+f(r)+','+f(g2)+','+f(b2)+')';}
function limb(g,ax,ay,bx,by,cx,cy,w,col){g.strokeStyle=col;g.lineWidth=w;g.lineCap='round';g.lineJoin='round';g.beginPath();g.moveTo(ax,ay);g.quadraticCurveTo(bx,by,cx,cy);g.stroke();}
function mawashiFor(pos){return pos>=YOKO?'#2b2440':pos>=KOMU?'#a5761f':pos>=JURYO?'#5d3a92':'#26262e';}
function lookFor(kg,pos,face,mawashi){return{w:clamp(.72+(kg-90)/115,.68,1.55),face,skin:SKIN[face.skin],mawashi:mawashi||mawashiFor(pos),tsuna:pos>=YOKO,oicho:pos>=JURYO};}

/* ===== realistic rendering: shaded capsule limbs, sculpted torso, painted head ===== */
function capsules(g,pts){
  for(let i=0;i<pts.length-1;i++){const a=pts[i],b=pts[i+1];const dx=b[0]-a[0],dy=b[1]-a[1],d=Math.hypot(dx,dy)||1,nx=-dy/d,ny=dx/d;
    g.beginPath();g.moveTo(a[0]+nx*a[2],a[1]+ny*a[2]);g.lineTo(b[0]+nx*b[2],b[1]+ny*b[2]);g.lineTo(b[0]-nx*b[2],b[1]-ny*b[2]);g.lineTo(a[0]-nx*a[2],a[1]-ny*a[2]);g.closePath();g.fill();}
  for(const p of pts){g.beginPath();g.arc(p[0],p[1],p[2],0,6.283);g.fill();}
}
/* fills a limb as a cylinder: lit on its upper side, falling into shadow underneath */
function limbR(g,pts,sk){
  const a=pts[0],b=pts[pts.length-1];const dx=b[0]-a[0],dy=b[1]-a[1],d=Math.hypot(dx,dy)||1;let nx=-dy/d,ny=dx/d;if(ny>0){nx=-nx;ny=-ny;}
  const mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2,R=Math.max(...pts.map(p=>p[2]))*1.15;
  const gr=g.createLinearGradient(mx+nx*R,my+ny*R,mx-nx*R,my-ny*R);
  gr.addColorStop(0,shade(sk,.16));gr.addColorStop(.3,shade(sk,.04));gr.addColorStop(.7,shade(sk,-.12));gr.addColorStop(1,shade(sk,-.3));
  g.fillStyle=gr;capsules(g,pts);
}
function softSpot(g,x,y,r,col,a){const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,'rgba('+col+','+a+')');gr.addColorStop(1,'rgba('+col+',0)');g.fillStyle=gr;g.fillRect(x-r,y-r,r*2,r*2);}

/* ---- head ---- */
const SHAPES=[{rx:.95,ry:.98,jw:.98,jy:.4},{rx:.86,ry:1.05,jw:.8,jy:.42},{rx:.92,ry:.96,jw:1.1,jy:.36},{rx:.9,ry:.95,jw:1.16,jy:.5}];
function headShape(g,r,F,fx){const S=SHAPES[F.shape];g.moveTo(r*S.rx,0);g.ellipse(0,-r*.06,r*S.rx,r*S.ry,0,0,6.283);
  g.moveTo(fx*.5+r*S.jw*.82,r*S.jy);g.ellipse(fx*.5,r*S.jy,r*S.jw*.82,r*.6,0,0,6.283);}
function drawHead(g,r,F,yaw,expr,oicho){
  const sk=SKIN[F.skin],ink='#1d140f',S=SHAPES[F.shape];
  const fx=yaw*r*.42,front=yaw<.3;
  // ears
  const ear=(x,flip)=>{g.save();g.translate(x,r*.08);g.scale(flip,1);g.fillStyle=shade(sk,-.12);g.beginPath();g.ellipse(0,0,r*.17,r*.27,.12,0,6.283);g.fill();
    g.strokeStyle=shade(sk,-.35);g.lineWidth=r*.035;g.beginPath();g.arc(r*.02,-r*.02,r*.1,-1.9,1.6);g.stroke();g.restore();};
  if(front){ear(-r*S.rx,-1);ear(r*S.rx,1);}
  // double chin + jowls behind the face mass
  const cg=g.createLinearGradient(0,r*.5,0,r*1.15);cg.addColorStop(0,shade(sk,-.06));cg.addColorStop(1,shade(sk,-.3));
  g.fillStyle=cg;g.beginPath();g.ellipse(fx*.4,r*.86,r*.66*S.jw,r*.3,0,0,6.283);g.fill();
  // face mass with sculpted light
  const lg=g.createRadialGradient(fx*.7+r*.1,-r*.35,r*.05,fx*.3,r*.05,r*1.25);
  lg.addColorStop(0,shade(sk,.14));lg.addColorStop(.45,sk);lg.addColorStop(1,shade(sk,-.28));
  g.fillStyle=lg;g.beginPath();headShape(g,r,F,fx);g.fill('nonzero');
  g.save();g.beginPath();headShape(g,r,F,fx);g.clip('nonzero');
  // back of head falls into shade (three-quarter view)
  if(!front){const bg=g.createLinearGradient(-r,0,fx,0);bg.addColorStop(0,'rgba(60,30,15,.38)');bg.addColorStop(1,'rgba(60,30,15,0)');g.fillStyle=bg;g.fillRect(-r*1.3,-r*1.3,r*2.6,r*2.6);}
  softSpot(g,fx-r*.05,r*.95,r*.75,'60,30,15',.35);                         // under-jaw shadow
  softSpot(g,fx+r*.32,r*.3,r*.3,'205,90,70',F.extra===3?.32:.12);           // cheek warmth
  softSpot(g,fx-r*.34*(1-.55*yaw),r*.3,r*.26*(1-.4*yaw),'205,90,70',F.extra===3?.28:.1);
  // stubble
  if(F.extra===2){g.fillStyle='rgba(40,30,30,.38)';const hr=k=>{const v=Math.sin(k*12.9898)*43758.5453;return v-Math.floor(v);};for(let i=0;i<220;i++){const a=hr(i)*6.283,rr=Math.sqrt(hr(i+500));const x=fx*.6+Math.cos(a)*rr*r*.78,y=r*.6+Math.sin(a)*rr*r*.42;if(y<r*.42&&Math.abs(x-fx)<r*.3)continue;g.fillRect(x,y,r*.022,r*.022);}}
  // hair cap with a hairline
  const hg=g.createLinearGradient(0,-r*1.1,0,r*.2);hg.addColorStop(0,'#2b241f');hg.addColorStop(1,'#0d0a08');g.fillStyle=hg;g.beginPath();
  if(front){g.moveTo(-r*1.1,r*.05);g.lineTo(-r*.92,-r*.2);g.quadraticCurveTo(-r*.6,-r*.62,0,-r*.6);g.quadraticCurveTo(r*.6,-r*.62,r*.92,-r*.2);g.lineTo(r*1.1,r*.05);g.lineTo(r*1.1,-r*1.3);g.lineTo(-r*1.1,-r*1.3);}
  else{g.moveTo(-r*1.2,r*.6);g.lineTo(-r*.55,r*.05);g.quadraticCurveTo(-r*.25,-r*.15,-r*.08,-r*.32);g.quadraticCurveTo(fx-r*.05,-r*.62,fx+r*.42,-r*.6);g.lineTo(fx+r*.6,-r*1.3);g.lineTo(-r*1.2,-r*1.3);}
  g.closePath();g.fill();
  if(F.extra===1){g.fillStyle='#120e0b';if(front){g.fillRect(-r*.95,-r*.25,r*.2,r*.55);g.fillRect(r*.75,-r*.25,r*.2,r*.55);}else{g.beginPath();g.moveTo(-r*.12,-r*.3);g.lineTo(r*.02,-r*.3);g.lineTo(-r*.02,r*.3);g.lineTo(-r*.14,r*.25);g.closePath();g.fill();}}
  // combed oil sheen
  g.strokeStyle='rgba(255,255,255,.13)';g.lineWidth=r*.025;
  for(let i=0;i<7;i++){const k=i/6;g.beginPath();if(front){g.moveTo(lerp(-r*.7,r*.7,k),-r*.6);g.quadraticCurveTo(lerp(-r*.4,r*.4,k),-r*.95,0,-r*1.05);}
    else{g.moveTo(lerp(-r*.2,fx+r*.35,k),-r*.5+(k*.1-.05)*r);g.quadraticCurveTo(-r*.2,-r*.95,-r*.35,-r*1.0);}g.stroke();}
  softSpot(g,front?-r*.2:fx-r*.25,-r*.82,r*.3,'255,255,255',.16);
  g.restore();
  if(!front)ear(-r*.38-yaw*r*.12,1);
  // top-knot
  g.save();g.translate(front?0:-r*.12,-r*.98);
  const kg=g.createLinearGradient(0,-r*.5,0,r*.1);kg.addColorStop(0,'#3a322b');kg.addColorStop(1,'#0d0a08');g.fillStyle=kg;
  if(oicho){g.beginPath();g.moveTo(0,r*.1);g.quadraticCurveTo(-r*.66,-r*.1,-r*.52,-r*.5);g.quadraticCurveTo(0,-r*.36,r*.52,-r*.5);g.quadraticCurveTo(r*.66,-r*.1,0,r*.1);g.fill();
    g.strokeStyle='rgba(255,255,255,.14)';g.lineWidth=r*.02;for(let i=-3;i<=3;i++){g.beginPath();g.moveTo(0,r*.05);g.lineTo(i*r*.15,-r*.43+Math.abs(i)*r*.03);g.stroke();}}
  else{g.beginPath();g.ellipse(front?0:r*.12,-r*.08,front?r*.18:r*.36,r*.13,front?0:-.18,0,6.283);g.fill();softSpot(g,front?0:r*.12,-r*.15,r*.18,'255,255,255',.18);}
  g.fillStyle='#f2efe6';g.fillRect(-r*.06,-r*.04,r*.12,r*.1);   // motoyui tie
  g.restore();
  // ----- features -----
  const sFar=1-.4*yaw,ex=[fx-r*.33*(1-.58*yaw),fx+r*.33*(1-.2*yaw)],es=[sFar,1],ey=-r*.06,by=-r*.27;
  // brow ridge shade + brows as hair strokes
  const bt=[1.4,.7,1.1,1.1][F.brow],tilt=[0,0,.09,-.09][F.brow]*r;
  for(let i=0;i<2;i++){const x=ex[i],s=es[i],sd=i?1:-1;let inner=0;
    if(expr==='strain'||expr==='win')inner+=.08*r;if(expr==='lose'||expr==='sleep')inner-=.07*r;if(expr==='happy')inner-=.03*r;
    softSpot(g,x,ey-r*.06,r*.2*s,'90,45,25',.2);
    g.strokeStyle='#1d140f';g.lineCap='round';
    for(let k=0;k<9;k++){const q=k/8,px=x+lerp(-sd*.15,sd*.19,q)*r*s,py=by+lerp(inner,tilt,q)-Math.sin(q*Math.PI)*r*.04;
      g.lineWidth=r*.028*bt*(1-.4*Math.abs(q-.4));g.beginPath();g.moveTo(px,py+r*.025);g.lineTo(px+sd*r*.05*s,py-r*.02);g.stroke();}}
  // eyes
  for(let i=0;i<2;i++){const x=ex[i],s=es[i],sd=i?1:-1,ew=r*.13*s;
    if(expr==='blink'||expr==='sleep'||expr==='happy'||expr==='lose'){
      g.strokeStyle='#2a1a12';g.lineWidth=r*.04;g.beginPath();
      if(expr==='happy'){g.moveTo(x-ew,ey+r*.02);g.quadraticCurveTo(x,ey-r*.07,x+ew,ey+r*.02);}
      else if(expr==='lose'){g.moveTo(x-ew,ey-r*.04);g.quadraticCurveTo(x,ey+r*.05,x+ew,ey-r*.01);g.moveTo(x-ew*.9,ey+r*.06);g.lineTo(x+ew*.6,ey+r*.05);}
      else{g.moveTo(x-ew,ey);g.quadraticCurveTo(x,ey+r*.05,x+ew,ey);}g.stroke();continue;}
    let eh=[.045,.085,.06,.06][F.eye]*r,rot=F.eye===2?-sd*.22:F.eye===3?sd*.22:0;if(F.eye===1)rot=0;
    if(expr==='strain')eh*=.5;
    g.save();g.translate(x,ey);g.rotate(rot);
    const almond=()=>{g.beginPath();g.moveTo(-ew,0);g.quadraticCurveTo(0,-eh*2,ew,0);g.quadraticCurveTo(0,eh*1.5,-ew,0);g.closePath();};
    almond();g.fillStyle='#efe7da';g.fill();
    g.save();almond();g.clip();const ir=Math.max(eh*1.1,r*.05),lx=yaw*r*.04;
    g.fillStyle='#3b2416';g.beginPath();g.arc(lx,-eh*.2,ir,0,6.283);g.fill();g.fillStyle='#0e0806';g.beginPath();g.arc(lx,-eh*.2,ir*.5,0,6.283);g.fill();
    g.fillStyle='rgba(0,0,0,.25)';g.fillRect(-ew,-eh*2,ew*2,eh*.9);g.restore();
    g.fillStyle='rgba(255,255,255,.85)';g.beginPath();g.arc(lx+ir*.35,-eh*.55,Math.max(.6,ir*.25),0,6.283);g.fill();
    g.strokeStyle='#22150e';g.lineWidth=r*.045;g.beginPath();g.moveTo(-ew*1.05,eh*.1);g.quadraticCurveTo(0,-eh*2.05,ew*1.05,-eh*.1);g.stroke();
    g.strokeStyle='rgba(90,45,25,.35)';g.lineWidth=r*.02;g.beginPath();g.moveTo(-ew*.8,eh*.6);g.quadraticCurveTo(0,eh*1.4,ew*.8,eh*.5);g.stroke();
    g.restore();
    if(expr==='strain'){g.strokeStyle='rgba(90,45,25,.35)';g.lineWidth=r*.02;for(let k=0;k<2;k++){g.beginPath();g.moveTo(x+sd*ew*1.1,ey+k*r*.04);g.lineTo(x+sd*ew*1.45,ey-r*.03+k*r*.07);g.stroke();}}
  }
  // nose: bridge shade, ball highlight, nostril
  const nx=fx+yaw*r*.2,ny=r*.2,nb=[.12,.09,.065][F.nose],nl=[1,1.25,.8][F.nose];
  g.strokeStyle='rgba(110,55,30,.32)';g.lineWidth=r*.05;g.beginPath();g.moveTo(nx-r*.06,-r*.08);g.quadraticCurveTo(nx-r*.08,ny*.5,nx-r*.09,ny*nl-r*.02);g.stroke();
  if(F.nose===1&&!front){g.fillStyle=shade(sk,.02);g.beginPath();g.moveTo(nx,-r*.08);g.quadraticCurveTo(nx+r*.17,ny*.7,nx+r*.13,ny*nl+r*.04);g.lineTo(nx,ny*nl+r*.06);g.closePath();g.fill();}
  softSpot(g,nx+r*.01,ny*nl,nb*r*1.8,'255,235,215',.25);
  g.fillStyle=shade(sk,-.08);g.beginPath();g.ellipse(nx,ny*nl+r*.02,nb*r,nb*r*.8,0,0,6.283);g.fill();
  softSpot(g,nx-nb*r*.3,ny*nl-nb*r*.2,nb*r*.7,'255,240,225',.45);
  g.strokeStyle='#5a2c1c';g.lineWidth=r*.035;g.beginPath();g.arc(nx-r*.01,ny*nl+r*.06,nb*r*.55,.4,2.4);g.stroke();
  if(front){g.beginPath();g.arc(nx+nb*r*.9,ny*nl+r*.04,nb*r*.35,2.2,4.2);g.stroke();g.beginPath();g.arc(nx-nb*r*.9,ny*nl+r*.04,nb*r*.35,-1,1);g.stroke();}
  // mouth
  const mx=fx+yaw*r*.12,my=r*.5,mw=r*.25*(1-.2*yaw)*(F.mouth===3?.6:1);
  g.strokeStyle='rgba(110,55,30,.28)';g.lineWidth=r*.025;g.beginPath();g.moveTo(mx,ny*nl+r*.12);g.lineTo(mx,my-r*.05);g.stroke();     // philtrum
  let curve=[0,-.07,.07,0][F.mouth];if(expr==='happy'||expr==='win')curve=.09;
  if(expr==='strain'){g.fillStyle='#fbf6ea';g.beginPath();g.roundRect(mx-mw,my-r*.05,mw*2,r*.1,r*.03);g.fill();g.strokeStyle='#5a2c1c';g.lineWidth=r*.03;g.stroke();
    g.beginPath();for(let k=-2;k<=2;k++){g.moveTo(mx+k*mw*.4,my-r*.05);g.lineTo(mx+k*mw*.4,my+r*.05);}g.lineWidth=r*.012;g.stroke();
    g.strokeStyle='rgba(110,55,30,.3)';g.lineWidth=r*.02;for(const s of[-1,1]){g.beginPath();g.moveTo(mx+s*mw*1.1,ny);g.quadraticCurveTo(mx+s*mw*1.5,my-r*.05,mx+s*mw*1.2,my+r*.12);g.stroke();}}
  else if(expr==='lose'||expr==='sleep'){const ow=expr==='sleep'?.05:.13;g.fillStyle='#3a1414';g.beginPath();g.ellipse(mx,my+r*.03,r*ow*1.4,r*ow,0,0,6.283);g.fill();
    g.fillStyle='rgba(196,110,95,.7)';g.beginPath();g.ellipse(mx,my+r*.03+r*ow,r*ow*1.2,r*.035,0,0,6.283);g.fill();}
  else{g.fillStyle='rgba(185,95,80,.75)';g.beginPath();g.ellipse(mx,my+r*.05,mw*.75,r*.05,0,0,6.283);g.fill();          // lower lip
    softSpot(g,mx,my+r*.14,r*.12,'90,40,25',.25);
    g.strokeStyle='#6a3226';g.lineWidth=r*.035;g.beginPath();g.moveTo(mx-mw,my-curve*r*.6);g.quadraticCurveTo(mx-mw*.3,my+curve*r*.6,mx,my-r*.01);g.quadraticCurveTo(mx+mw*.3,my+curve*r*.6,mx+mw,my-curve*r*.6);g.stroke();
    if(expr==='happy'||expr==='win'){g.strokeStyle='rgba(110,55,30,.3)';g.lineWidth=r*.02;for(const s of[-1,1]){g.beginPath();g.moveTo(mx+s*mw*1.05,ny+r*.02);g.quadraticCurveTo(mx+s*mw*1.45,my-r*.08,mx+s*mw*1.15,my+r*.02);g.stroke();}}}
}

/* ---- body ---- */
function torsoPath(g,u,w,j){
  const X=v=>v*u*w,Y=v=>v*u;

const TL={out:{imp:.16,drive:1.0,edge:1.45,land:1.8,end:2.5},down:{imp:.16,drive:1.0,edge:1.4,land:1.75,end:2.6},throw:{imp:.16,drive:1.0,edge:1.3,land:1.62,end:2.45},slap:{imp:.16,drive:.72,edge:1.02,land:1.28,end:2.1}};
function resolve(q){
  const o=B.opp,s=B.strat;
  const ostrat=Math.random()<.65?o.style:pick(['oshi','yotsu','waza']);
  let me=power(st.stats,st.kg,s,st.fat,st.inj)+({sharp:6,normal:1,late:-5}[q]);
  const op=power(o.stats,o.kg,ostrat,0,0);
  if(BEATS[s]===ostrat)me+=7;else if(BEATS[ostrat]===s)me-=7;
  const win=Math.random()<1/(1+Math.exp(-(me-op)/5));
  const ws=win?s:ostrat,km=pick(KIMARITE[ws]);
  const kind=ws==='waza'&&km!=='送り出し'?'slap':km.includes('投げ')?'throw':km.includes('倒し')?'down':'out';
  st.fat=Math.min(100,st.fat+2.5);
  const k=win?{oshi:'oshi',yotsu:'chikara',waza:'waza'}[s]:null;if(k)st.stats[k]+=.25*(1-st.stats[k]/120);
  if(win){B.w++;B.marks+='○';}else{B.l++;B.marks+='●';}B.day++;
  const upset=win&&o.pos-st.pos>=6;
  anim={phase:'clash',t:0,win,km,ws,kind,tq:q,TL:TL[kind],dw:win?1:-1,c0:(q==='sharp'?.03:q==='late'?-.03:0),hit:{},freeze:0,upset,thrust:ws==='oshi'};
  persist();
}
/* Choreography modelled on how bouts actually unfold:
   shikiri with both fists down -> low charge and frontal collision ->
   oshi: thrusts to the chest / yotsu: chest to chest with hands on the belt ->
   finish by kimarite: step-out (oshidashi/yorikiri/okuridashi), fall (taoshi),
   throw (nage), or slap-down where the loser's hands hit the clay.
   After the bout the winner walks back to his line and bows. */
const READY={lean:.95,crouch:1,armF:.2,armB:.2,hd:1,handX:.78,fall:0,lift:0,stride:0,expr:'strain',headJolt:0};
function choreo(a,T,W,cx,edge){
  const L=a.TL,dw=a.dw,c0=cx+a.c0*W,grip=a.ws==='yotsu',gap=W*(grip?.15:.17),start=W*.23;
  let wP={...READY},lP={...READY},wX,lX;
  const wS=cx-dw*start,lS=cx+dw*start;
  const hitArmF=grip?.5:1.08,hitArmB=grip?.46:.98;
  // 1) tachiai: rise out of the crouch and collide
  if(T<L.imp){const k=easeIn(T/L.imp),m=(p,q)=>lerp(p,q,k);

  if(!rc||!rcData)return;const{g,W,H}=rc;g.clearRect(0,0,W,H);
  const gl=g.createRadialGradient(W/2,H*.55,10,W/2,H*.55,W*.5);gl.addColorStop(0,rcData.yusho?'rgba(226,176,74,.45)':'rgba(255,255,255,.08)');gl.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gl;g.fillRect(0,0,W,H);
  g.fillStyle='rgba(199,150,90,.45)';g.beginPath();g.ellipse(W/2,H*.88,W*.4,H*.06,0,0,6.283);g.fill();
  const e=t-rcData.t0,k=ease(e/.8),u=H*.24,L=lookFor(st.kg,st.pos,st.face);
  if(rcData.yusho){
    const lift=ease(e/1.0);
    drawRikishi(g,W*.44,H*.88,u,1,{lean:.02,crouch:.05,armF:lerp(.4,1.25,lift),armB:lerp(.3,1.15,lift),expr:'happy',t},L);
    const cx=W*.44+u*1.3,cy=H*.88-u*lerp(1.4,2.25,lift)+Math.sin(t*2)*2;
    g.fillStyle='#e2b04a';g.beginPath();g.moveTo(cx-u*.35,cy-u*.5);g.lineTo(cx+u*.35,cy-u*.5);g.quadraticCurveTo(cx+u*.3,cy+u*.1,cx,cy+u*.15);g.quadraticCurveTo(cx-u*.3,cy+u*.1,cx-u*.35,cy-u*.5);g.fill();
    g.fillStyle='rgba(255,255,255,.4)';g.fillRect(cx-u*.22,cy-u*.45,u*.06,u*.4);g.fillStyle='#e2b04a';
    g.fillRect(cx-u*.05,cy+u*.1,u*.1,u*.3);g.fillRect(cx-u*.2,cy+u*.38,u*.4,u*.08);
    for(let i=0;i<18;i++){const r=(t*45+i*37)%(H*.95);g.save();g.translate(W*.06+((i*53)%88)/88*W*.88+Math.sin(t*2+i)*8,r);g.rotate(t*3+i);g.fillStyle=['#e2b04a','#f3eee2','#b3261e'][i%3];g.fillRect(-2,-3,4,6);g.restore();}
  }else if(rcData.win){const bow=e<1.2?Math.sin(clamp(e/1.2,0,1)*Math.PI)*.5:0;
    drawRikishi(g,W*.5,H*.88,u,1,{lean:bow+Math.sin(t*1.5)*.01,crouch:.08,armF:.05,armB:.05,expr:e>1.2?'win':'normal',t},L);}
  else drawRikishi(g,W*.5,H*.88,u,1,{lean:.35+Math.sin(t*1.2)*.02,crouch:.22,armF:0,armB:0,expr:'lose',headJolt:.15,t},L);
}

/* ---------- loop ---------- */
let last=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;const t=now/1000;
  if(facePop>0)facePop=Math.max(0,facePop-dt*4);
  if(cur==='sTitle')drawHero(t);
  else if(cur==='sCreate')drawFacePrev(t);
  else if(cur==='sHome')drawAvatar(t,dt);
  else if(cur==='sBout'){updateBout(dt);drawBout(t,dt);drawProfFace(t);}
  else if(cur==='sResult')drawResult(t,dt);
  requestAnimationFrame(loop);
}
addEventListener('resize',()=>{crowdCache=null;if(cur==='sTitle')hero=makeCanvas($('heroCv'),.75);if(cur==='sCreate')facePrev=makeCanvas($('facePrev'),1);
  if(cur==='sHome'&&avatar){const a=avatar.act;avatar=makeCanvas($('avatar'),160/132);avatar.act=a;}if(cur==='sBout'){ring=makeCanvas($('ring'),330/400);faceCv=makeCanvas($('bFace'),1);}if(cur==='sResult'&&rc)rc=makeCanvas($('rCv'),1);});

/* ---------- wire ---------- */
$('newBtn').addEventListener('click',openCreate);
$('contBtn').addEventListener('click',()=>{st=load();if(!st)return;if(st.basho)startBasho();else renderHome();});
$('randName').addEventListener('click',()=>{$('nameIn').value=pick(NAMES);});
$('faceRand').addEventListener('click',()=>{draftFace=randFace();buildFaceOpts();facePop=1;});
$('enterBtn').addEventListener('click',enter);
$('bashoBtn').addEventListener('click',startBasho);
$('toTitle').addEventListener('click',()=>{persist();renderTitle();});
document.querySelectorAll('.strats button').forEach(b=>b.addEventListener('click',()=>choose(b.dataset.s)));
$('tachiBtn').addEventListener('click',tachi);
$('ring').addEventListener('pointerdown',()=>{if(anim&&anim.phase==='tachi')tachi();});
$('nextBtn').addEventListener('click',nextBout);
$('backHome').addEventListener('click',()=>{rcData=null;renderHome();});
$('autoChk').addEventListener('change',e=>{autoMode=e.target.checked;
  if(autoMode&&anim){if(anim.phase==='ready'||anim.phase==='intro')choose(counterOf(B.opp.style));else if(anim.phase==='tachi'){$('bTachi').hidden=true;resolve('normal');}else if(anim.phase==='done')nextBout();}});
addEventListener('keydown',e=>{if(e.code==='Space'&&anim&&anim.phase==='tachi'){e.preventDefault();tachi();}});

renderTitle();requestAnimationFrame(loop);
})();
</script>
